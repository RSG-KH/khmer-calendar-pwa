name: Build Windows 7 release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag / GitHub Release to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-7-portable:
    name: Build Windows 7 portable ZIPs
    runs-on: windows-2022

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Validate target release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "No release tag was supplied."
          }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" | Out-Null
          Write-Host "Building release: $env:RELEASE_TAG"

      - name: Check out exact released PWA source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: app
          fetch-depth: 1

      - name: Check out Windows 7 compatibility kit
        uses: actions/checkout@v4
        with:
          ref: win7-portable
          path: win7-kit
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply Windows 7 compatibility kit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\win7-kit\scripts\apply-win7.ps1" `
            -RepoPath "$env:GITHUB_WORKSPACE\app" `
            -KitPath "$env:GITHUB_WORKSPACE\win7-kit"

      - name: Build x64 and ia32 portable ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\app\scripts\build-win7-release.ps1" `
            -RepoPath "$env:GITHUB_WORKSPACE\app" `
            -ReleaseTag "$env:RELEASE_TAG"

      - name: Upload CI artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-Calendar-Windows7-${{ env.RELEASE_TAG }}
          path: |
            app/release-win7/zips/Khmer-Calendar-Win7-x64.zip
            app/release-win7/zips/Khmer-Calendar-Win7-ia32.zip
            app/release-win7/zips/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach Windows 7 files to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release upload "$env:RELEASE_TAG" `
            "$env:GITHUB_WORKSPACE\app\release-win7\zips\Khmer-Calendar-Win7-x64.zip" `
            "$env:GITHUB_WORKSPACE\app\release-win7\zips\Khmer-Calendar-Win7-ia32.zip" `
            "$env:GITHUB_WORKSPACE\app\release-win7\zips\SHA256SUMS.txt" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
