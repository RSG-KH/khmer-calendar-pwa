<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar safe-area checks</title>
  <style>
    body { margin: 16px; background: #dce1e7; color: #202530; font: 14px system-ui; }
    select, button { font: inherit; margin-right: 8px; }
    header { margin-bottom: 12px; }
    pre { white-space: pre-wrap; max-height: 120px; overflow: auto; }
    iframe { display: block; border: 1px solid #8792a2; transform: scale(.65); transform-origin: top left; }
  </style>
</head>
<body>
  <header>
    <label for="profile">Safe-area profile</label>
    <select id="profile"></select>
    <button id="run" type="button">Run all checks</button>
    <p>Layout simulation only. Cutout insets and viewport-unit shortfalls are simulated; browser/OS-owned screen regions still need testing on real devices.</p>
    <pre id="result" role="status">Loading…</pre>
  </header>
  <iframe title="Khmer Calendar safe-area preview"></iframe>
  <script type="module">
    const profiles = [
      { name: 'Desktop', width: 1366, height: 900, native: false },
      { name: 'Android tablet portrait', width: 800, height: 1280 },
      { name: 'Android tablet landscape', width: 1280, height: 800 },
      { name: 'iPad portrait', width: 834, height: 1194, top: 24, bottom: 20, font: 1.5 },
      { name: 'iPad portrait · short viewport units', width: 834, height: 1194, top: 24, bottom: 20, shortfall: 20, font: 1.5 },
      { name: 'iPad landscape', width: 1194, height: 834, top: 24, bottom: 20, font: 1.5 },
      { name: 'iPhone portrait', width: 390, height: 844, top: 47, bottom: 34 },
      { name: 'iPhone portrait · short viewport units', width: 390, height: 844, top: 47, bottom: 34, shortfall: 34 },
      { name: 'iPhone portrait · light theme', width: 390, height: 844, top: 59, bottom: 34, light: true },
      { name: 'iPhone landscape', width: 844, height: 390, left: 47, right: 47, bottom: 21 },
      { name: 'Android phone portrait · system bars outside web viewport', width: 393, height: 873 },
      { name: 'Android phone portrait · edge to edge', width: 393, height: 873, top: 32, bottom: 24 },
      { name: 'Android phone landscape · left cutout', width: 873, height: 393, left: 44 },
      { name: 'Android phone landscape · right cutout', width: 873, height: 393, right: 44 },
      { name: 'Narrow landscape · bottom navigation', width: 700, height: 360, left: 32, right: 16, bottom: 16 }
    ];
    const frame = document.querySelector('iframe');
    const picker = document.querySelector('#profile');
    const result = document.querySelector('#result');
    const run = document.querySelector('#run');
    profiles.forEach((profile, index) => picker.add(new Option(profile.name, String(index))));

    function simulateShortViewportUnits(rules, shortfall) {
      for (const rule of rules) {
        if (rule.style?.height === '100dvh') rule.style.height = `calc(100dvh - ${shortfall}px)`;
        if (rule.cssRules) simulateShortViewportUnits(rule.cssRules, shortfall);
      }
    }

    async function inspect(index) {
      const profile = profiles[index];
      picker.value = String(index);
      frame.width = profile.width;
      frame.height = profile.height;
      await new Promise(resolve => { frame.onload = resolve; frame.src = '/'; });
      const win = frame.contentWindow;
      const doc = win.document;
      if (profile.native !== false) doc.documentElement.removeAttribute('data-auto-hide-scrollbars');
      for (const [property, edge] of [['--sat', 'top'], ['--sab', 'bottom'], ['--sal', 'left'], ['--sar', 'right']]) {
        doc.documentElement.style.setProperty(property, `${profile[edge] || 0}px`);
      }
      doc.documentElement.style.setProperty('--font-scale', String(profile.font || 1));
      doc.documentElement.setAttribute('data-theme', profile.light ? 'light' : 'dark');
      if (profile.shortfall) {
        for (const sheet of doc.styleSheets) simulateShortViewportUnits(sheet.cssRules, profile.shortfall);
      }
      await new Promise(resolve => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
      const rect = selector => doc.querySelector(selector).getBoundingClientRect();
      const app = rect('#app');
      const footer = rect('.bottom-bar');
      const rail = rect('.left-nav-rail');
      const content = rect('.screen-container');
      const checks = [];
      const check = (name, passed) => checks.push({ name, passed });
      const near = (a, b) => Math.abs(a - b) < 1;
      check('App fills the available viewport', near(app.top, 0) && near(app.left, 0) && near(app.bottom, win.innerHeight) && near(app.right, win.innerWidth));
      check('Content clears top/right safe areas', content.top >= (profile.top || 0) - 1 && content.right <= win.innerWidth - (profile.right || 0) + 1);
      check('No horizontal page overflow', doc.documentElement.scrollWidth <= win.innerWidth + 1);
      if (footer.height) {
        const tab = rect('.nav-tab');
        check('Footer background reaches bottom and both sides', near(footer.bottom, win.innerHeight) && near(footer.left, 0) && near(footer.right, win.innerWidth));
        check('Bottom inset is counted once', near(footer.height, 60 + (profile.bottom || 0)) && tab.height <= 60 && near(tab.bottom, win.innerHeight - (profile.bottom || 0)));
        check('Footer buttons clear side cutouts', tab.left >= (profile.left || 0) - 1 && doc.querySelector('.bottom-bar').lastElementChild.getBoundingClientRect().right <= win.innerWidth - (profile.right || 0) + 1);
      } else {
        const item = rect('.rail-item');
        const railWidth = win.innerHeight < 600 ? 69 : 77.4;
        check('Rail background reaches camera-side edge', near(rail.left, 0));
        check('Rail controls keep their original width and clear cutout', near(rail.width, railWidth + (profile.left || 0)) && item.left >= (profile.left || 0) - 1);
      }
      return { profile: profile.name, passed: checks.every(check => check.passed), checks };
    }

    async function show(index) {
      result.textContent = 'Checking…';
      result.textContent = JSON.stringify(await inspect(index), null, 2);
    }
    picker.addEventListener('change', () => show(Number(picker.value)));
    run.addEventListener('click', async () => {
      run.disabled = picker.disabled = true;
      try {
        const reports = [];
        for (let index = 0; index < profiles.length; index++) {
          result.textContent = `Checking ${profiles[index].name}…`;
          reports.push(await inspect(index));
        }
        result.textContent = JSON.stringify({ passed: reports.every(report => report.passed), profiles: reports.length, failures: reports.filter(report => !report.passed) }, null, 2);
      } finally { run.disabled = picker.disabled = false; }
    });
    show(0);
  </script>
</body>
</html>
